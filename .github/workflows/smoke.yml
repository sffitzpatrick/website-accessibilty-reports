name: Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and Playwright browsers
        run: |
          npm ci
          npx playwright install
          npx playwright install-deps

      - name: Run dry-run crawler
        run: |
          node crawler.js --start-url=https://example.com --report-dir=tmp-smoke --max-pages=0 --dry-run

      - name: List outputs
        run: |
          ls -R tmp-smoke || true
