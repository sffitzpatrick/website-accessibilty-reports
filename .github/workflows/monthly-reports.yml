# .github/workflows/monthly-report.yml
name: Monthly Website Report

on:
  schedule:
    - cron: '0 6 1 * *' # Monthly on the 1st at 6AM UTC
  workflow_dispatch:     # Optional: allow manual runs

jobs:

  set-date:
    runs-on: ubuntu-latest
    outputs:
      datestamp: ${{ steps.set.outputs.datestamp }}
    steps:
      - id: set
        run: echo "datestamp=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
        
  audit:
    runs-on: ubuntu-latest

    needs: set-date

    strategy:
      matrix:
        site:
          - name: clearview-drupal
            url: https://clearviewlibrary.org
            max_pages: 500
          - name: clearview-communico
            url: https://clearview.libnet.info/events
            max_pages: 500
          - name: clearview-pika
            url: https://pika.clearviewlibrary.org/
            max_pages: 50
          - name: urbana-drupal
            url: https://urbanafreelibrary.org/
            max_pages: 500
          - name: urbana-communico
            url: https://urbanafreelibrary.libnet.info/events
            max_pages: 500
          - name: urbana-polaris
            url: https://cucatalog.org/polaris/default.aspx?ctx=6.1033.0.0.5
            max_pages: 50
          - name: amigos-drupal
            url: https://www.amigos.org/
            max_pages: 50


    env:
      SITE_NAME: ${{ matrix.site.name }}
      SITE_URL: ${{ matrix.site.url }}
      REPORT_RECIPIENT: ${{ matrix.site.report_recipient }}
      MAX_PAGES: ${{ matrix.site.max_pages }}
      DATESTAMP: ${{ needs.set-date.outputs.datestamp }}
      REPORT_DIR: docs/scheduled-reports/${{ matrix.site.name }}/${{ needs.set-date.outputs.datestamp }}


    steps:

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # Fetch full history so we can pull and push safely


      - name: Set dynamic datestamp
        run: echo "DATESTAMP=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      
      - name: Create report folder
        run: |
          mkdir -p $REPORT_DIR

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: |
          npm install
          npm ci
          npx playwright install
          npx playwright install-deps
      
      - name: Run a11y scan
        run: node crawler.js --report-dir=$REPORT_DIR --max-pages=$MAX_PAGES  --site-name=$SITE_NAME --start-url=$SITE_URL --datestamp=$DATESTAMP

      - name: Generate a11y reports
        run: node summary-reporter.js --report-dir=$REPORT_DIR --site-name=$SITE_NAME --start-url=$SITE_URL --datestamp=$DATESTAMP

      - name: Generate HTML Dashboard
        run: |
          node generate-dashboard.js \
            --report-dir $REPORT_DIR \
            --site-name "${{ env.SITE_NAME }}" \
            --datestamp "${{ env.DATESTAMP }}" \
            --page-count ${{ steps.count_pages.outputs.total }}

      # Raw axe JSON is only needed to build the reports above; publishing it pushes Pages past its 10GB limit
      - name: Remove raw axe JSON
        run: rm -rf "$REPORT_DIR/axe_json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.site.name }}
          path: ${{ env.REPORT_DIR }}

      - name: Set metadata output
        id: set-meta
        run: |
          echo "{\"name\":\"${{ matrix.site.name }}\",\"url\":\"${{ matrix.site.url }}\"}" > site.json
          echo "site_info=$(cat site.json)" >> $GITHUB_OUTPUT

  commit-and-push:
    needs: [set-date, audit]
    runs-on: ubuntu-latest
    env:
      DATESTAMP: ${{ needs.set-date.outputs.datestamp }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-reports

      - run: |
          echo "Contents of downloaded-reports:"
          ls -R downloaded-reports

      - name: Move reports into dated directory
        run: |
          ls
          for dir in downloaded-reports/*; do
            site=$(basename "$dir" | sed 's/^report-//')
            mkdir -p docs/scheduled-reports/$site/$DATESTAMP/
            cp -r "$dir"/* docs/scheduled-reports/$site/$DATESTAMP/
          done

      - name: Configure Git for GitHub Actions
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Stage and commit before pull
        run: |
          git add docs/
          git commit -m "Stash local changes before pull" || echo "No changes"
          git pull origin main --rebase

      - name: Commit and Push Reports
        run: |
          git commit -m "Add reports for $DATESTAMP" || echo "No changes"
          git push origin main

      - name: email reports
        run: |
          for dir in ${{ env.DATESTAMP }}/*; do
            site=$(basename "$dir")
            echo "Sending email for $site..."

            curl --request POST \
              --url https://api.sendgrid.com/v3/mail/send \
              --header "Authorization: Bearer $SENDGRID_API_KEY" \
              --header 'Content-Type: application/json' \
              --data '{
                "personalizations": [{
                  "to": [{ "email": "sean@proofstudio.co" }],
                  "subject": "Report for '"$SITE_NAME"'"
                }],
                "from": { "email": "noreply@proofstudio.co" },
                "content": [{
                  "type": "text/plain",
                  "value": "The report for '"$SITE_NAME"' is ready. View it here: https://sffitzpatrick.github.io/website-accessibilty-reports/'"${{ env.REPORT_DIR }}"'"
                }]
              }'
          done
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API }}
          SITE_NAME: ${{ github.event.inputs.site_name }}
          DATESTAMP: ${{ needs.set-date.outputs.datestamp }}
          REPORT_DIR: /scheduled-reports/${{ github.event.inputs.site_name }}/${{ needs.set-date.outputs.datestamp }}
